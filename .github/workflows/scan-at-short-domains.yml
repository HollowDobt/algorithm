name: Scan short .at domains

on:
  push:
    branches:
      - tmp-at-domain-scan-20260718
    paths-ignore:
      - 'scan-output/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'scan-output/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-at-domain-scan-20260718

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check aiohttp dnspython

      - name: Run complete scan
        run: python tools/scan_at_short_domains.py

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: at-short-domain-results
          path: scan-output/
          retention-days: 7

      - name: Commit results to temporary branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scan-output
          git commit -m 'Add .at short-domain scan results' || exit 0
          git push origin HEAD:tmp-at-domain-scan-20260718
